<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1120" viewBox="0 0 1400 1120" role="img" aria-labelledby="title desc">
<title id="title">Kingswell in Asterfell — fictional city map</title>
<desc id="desc">A schematic local-grid map of Kingswell, Asterfell, with twelve districts, arterial and neighbourhood streets, three explicit river bridges and southern harbour edge. Not to scale.</desc>
<defs>
 <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#d7d9d4" stroke-width="1"/></pattern>
 <style>
 .district{stroke:#43534b;stroke-width:3;rx:12}
 .name{font:700 19px sans-serif;fill:#17251f;text-anchor:middle}
 .sub{font:13px sans-serif;fill:#27372f;text-anchor:middle}
 .road{fill:none;stroke:#fff;stroke-width:15;stroke-linecap:round;stroke-linejoin:round}
 .roadedge{fill:none;stroke:#59645d;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
 .minor{fill:none;stroke:#fff;stroke-width:7;stroke-linecap:round}
 .minorEdge{fill:none;stroke:#929a91;stroke-width:1.2}
 .label{font:700 15px sans-serif;fill:#26362e}
 </style>
</defs>
<rect width="1400" height="1120" fill="#edf0e8"/>
<rect x="70" y="85" width="1260" height="930" fill="url(#grid)" stroke="#45564b" stroke-width="4" rx="16"/>
<text x="700" y="48" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="700" fill="#1d3026">KINGSWELL — ASTERFELL MASTER CITY MAP</text>
<text x="700" y="72" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#526258">Asterfell • fictional local-grid schematic • North at top • district envelopes are planning areas</text>
