name: Publish Kingswell Game Test Centre
on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "city-map.html"
      - "records.html"
      - "record.html"
      - "geography.html"
      - "data/**"
      - "docs/geography/kingswell-detailed-road-network.svg"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Assemble test centre
        run: |
          mkdir -p _site/data
          cp index.html _site/index.html
          cp city-map.html _site/city-map.html
          cp records.html _site/records.html
          cp record.html _site/record.html
          cp geography.html _site/geography.html
          cp docs/geography/kingswell-detailed-road-network.svg _site/map.svg
          cp -R data/. _site/data/
          touch _site/.nojekyll
      - name: Verify published map and property data
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          site = Path("_site")
          required = [
              "index.html",
              "city-map.html",
              "records.html",
              "record.html",
              "geography.html",
              "map.svg",
              "data/kingswell-map-data.json",
              "data/kingswell-map-data-manifest.json",
          ]
          missing = [p for p in required if not (site / p).is_file()]
          if missing:
              raise SystemExit(f"Missing Pages assets: {missing}")

          data = json.loads((site / "data/kingswell-map-data.json").read_text())
          expected = {
              "properties": 656,
              "segments": 229,
              "districts": 12,
              "neighbourhoods": 24,
          }
          for key, count in expected.items():
              actual = len(data.get(key, []))
              if actual != count:
                  raise SystemExit(f"Unexpected {key} count: {actual}; expected {count}")

          units_dir = site / "data" / "units"
          if not units_dir.is_dir() or not any(units_dir.glob("*.json")):
              raise SystemExit("Property unit dossiers were not included in Pages artifact")

          print(
              "Map publication verified:",
              len(data["properties"]), "properties;",
              len(data["segments"]), "road segments;",
              len(list(units_dir.glob("*.json"))), "unit dossier files."
          )
          PY
      - name: Install Chromium for browser smoke test
        run: |
          python3 -m pip install --disable-pip-version-check playwright
          python3 -m playwright install --with-deps chromium
      - name: Verify map and property visibility in Chromium
        run: |
          python3 -m http.server 8765 --directory _site >/tmp/kingswell-pages-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          python3 - <<'PY'
          import time
          from pathlib import Path
          from playwright.sync_api import sync_playwright

          base = "http://127.0.0.1:8765"
          for _ in range(40):
              try:
                  import urllib.request
                  urllib.request.urlopen(base, timeout=1)
                  break
              except Exception:
                  time.sleep(0.5)
          else:
              raise SystemExit("Local Pages preview server did not start")

          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)
              page = browser.new_page(viewport={"width": 1440, "height": 1000})
              page_errors = []
              page.on("pageerror", lambda error: page_errors.append(str(error)))
              map_response = []
              page.on(
                  "response",
                  lambda response: map_response.append(response.status)
                  if "kingswell-map-data.json" in response.url else None
              )

              response = page.goto(base + "/index.html", wait_until="domcontentloaded")
              if not response or response.status != 200:
                  raise SystemExit("Kingswell main page did not load")

              page.wait_for_function(
                  "() => document.querySelector('#mapStatus')?.textContent.includes('CANONICAL SNAPSHOT LOADED')",
                  timeout=30000,
              )
              count = page.locator("#countBuildings").inner_text()
              if count != "656":
                  raise SystemExit(f"Browser shows {count} buildings, expected 656")
              if not map_response or map_response[-1] != 200:
                  raise SystemExit(f"Map JSON request failed: {map_response}")

              canvas = page.locator("#mapCanvas")
              metrics = canvas.evaluate("""c => {
                const r = c.getBoundingClientRect();
                const x = c.getContext('2d');
                const p = x.getImageData(Math.floor(c.width/2), Math.floor(c.height/2), 1, 1).data;
                return {width:r.width, height:r.height, pixel:[...p]};
              }""")
              if metrics["width"] < 300 or metrics["height"] < 250:
                  raise SystemExit(f"Map canvas is not visible: {metrics}")
              if metrics["pixel"][3] == 0:
                  raise SystemExit(f"Map canvas is blank: {metrics}")

              unit_file = next((Path("_site/data/units")).glob("*.json"), None)
              if unit_file is None:
                  raise SystemExit("No property unit dossier available")
              unit_url = base + "/data/units/" + unit_file.name
              unit_response = page.request.get(unit_url)
              if unit_response.status != 200:
                  raise SystemExit(f"Property dossier unavailable: {unit_url} ({unit_response.status})")

              print(
                  "Chromium smoke test passed:",
                  count, "buildings visible;",
                  "map JSON HTTP", map_response[-1],
                  "canvas", metrics["width"], "x", metrics["height"],
                  "property dossier HTTP", unit_response.status
              )
              # Exercise the new directory workspace and its record selection/search.
              directory = page.goto(base + "/records.html", wait_until="domcontentloaded")
              if not directory or directory.status != 200:
                  raise SystemExit("Kingswell record directory did not load")
              try:
                  page.wait_for_function(
                      "() => document.querySelector('#dataStatus')?.textContent.includes('Published geographic snapshot loaded')",
                      timeout=15000,
                  )
              except Exception:
                  directory_status = page.locator("#dataStatus").inner_text()
                  raise SystemExit(f"Directory failed to initialise: {directory_status}; browser errors: {page_errors}")
              page.locator('#tabs button[data-type="road"]').click()
              page.wait_for_function("() => document.querySelectorAll('.record').length > 0")
              first_record = page.locator(".record").first
              first_record.click()
              if page.locator("#dTitle").inner_text() == "Select a record":
                  raise SystemExit("Selecting a road did not open its individual geography record")
              selected_ref = page.locator(".record.selected .ref").inner_text()
              page.locator("#q").fill(selected_ref)
              if page.locator("#resultCount").inner_text().startswith("0"):
                  raise SystemExit("Geography search did not find the selected canonical reference")
              # Live Supabase-backed directories: paginated search and individual dossiers.
              page.locator("#q").fill("")
              for tab, minimum in [("people", 100000), ("business", 1000), ("organisation", 1000), ("property", 600)]:
                  page.locator(f'#tabs button[data-type="{tab}"]').click()
                  page.wait_for_function(
                      "() => { const t=document.querySelector('#resultCount')?.textContent || ''; return t.includes('MATCHING RECORDS') || t.includes('CONNECTION ERROR'); }",
                      timeout=45000,
                  )
                  count_text = page.locator("#resultCount").inner_text()
                  if "CONNECTION ERROR" in count_text:
                      raise SystemExit(f"{tab} live directory failed: {page.locator('#rows').inner_text()}")
                  if page.locator(".record[data-live-id]").count() == 0:
                      raise SystemExit(f"{tab} live directory returned no records: {count_text}")
                  first = page.locator(".record[data-live-id]").first
                  first.click()
                  page.wait_for_function(
                      "() => document.querySelector('#dTitle')?.textContent !== 'Loading record…'",
                      timeout=45000,
                  )
                  if page.locator("#dTitle").inner_text() in ("Select a record", "Record unavailable"):
                      raise SystemExit(f"{tab} individual record did not load: {page.locator('#dbody').inner_text()}")
                  if tab in ("business", "organisation", "property"):
                      href = page.locator('#dbody a[href*="record.html"]').first.get_attribute("href")
                      if not href:
                          raise SystemExit(f"{tab} directory preview has no full-record link")
                      full_response = page.goto(base + "/" + href.removeprefix("./"), wait_until="domcontentloaded")
                      if not full_response or full_response.status != 200:
                          raise SystemExit(f"{tab} full record page did not load")
                      page.wait_for_function(
                          "() => document.querySelector('#title')?.textContent !== 'Loading individual record…'",
                          timeout=45000,
                      )
                      if page.locator("#title").inner_text() in ("Record unavailable", "Loading individual record…"):
                          raise SystemExit(f"{tab} full record failed: {page.locator('#status').inner_text()}")
                      entity_sections = page.locator("#sections").inner_text().lower()
                      required_by_type = {
                          "business": ["business profile", "business operations", "registered organisation", "premises and sites", "workforce"],
                          "organisation": ["organisation identity", "organisation profile", "sites and premises"],
                          "property": ["property identity", "location", "property profile", "buildings", "units", "businesses", "organisation sites"],
                      }
                      for required_section in required_by_type[tab]:
                          if required_section not in entity_sections:
                              raise SystemExit(f"{tab} full record is missing {required_section}: {entity_sections}")
                      page.goto(base + "/records.html", wait_until="domcontentloaded")
                      page.wait_for_function(
                          "() => document.querySelector('#dataStatus')?.textContent.includes('Published geographic snapshot loaded')",
                          timeout=30000,
                      )
              page.locator('#tabs button[data-type="people"]').click()
              page.wait_for_function("() => { const t=document.querySelector('#resultCount')?.textContent || ''; return t.includes('MATCHING RECORDS') || t.includes('CONNECTION ERROR'); }", timeout=45000)
              selected_ref = page.locator(".record[data-live-id] .ref").first.inner_text()
              page.locator("#q").fill(selected_ref)
              page.wait_for_function(
                  "() => { const t=document.querySelector('#resultCount')?.textContent || ''; return t.includes('MATCHING RECORDS') || t.includes('CONNECTION ERROR'); }",
                  timeout=45000,
              )
              if page.locator(".record[data-live-id]").count() == 0:
                  raise SystemExit("Live person search by canonical reference returned no record")
              from urllib.parse import quote
              person_id = page.locator(".record[data-live-id]").first.get_attribute("data-live-id")
              full_record = page.goto(base + "/record.html?type=people&id=" + quote(person_id, safe=""), wait_until="domcontentloaded")
              if not full_record or full_record.status != 200:
                  raise SystemExit("Dedicated individual record page did not load")
              page.wait_for_function(
                  "() => document.querySelector('#title')?.textContent !== 'Loading individual record…'",
                  timeout=30000,
              )
              if page.locator("#title").inner_text() in ("Record unavailable", "Loading individual record…"):
                  raise SystemExit(f"Dedicated person record failed: {page.locator('#status').inner_text()}")
              person_sections = page.locator("#sections").inner_text()
              for required_section in [
                  "Personal & simulation profile",
                  "Households",
                  "Household members",
                  "Employment",
                  "Weekly routines",
                  "Life events",
                  "Population memberships",
                  "Relationships",
              ]:
                  if required_section.lower() not in person_sections.lower():
                      raise SystemExit(f"Person dossier is missing {required_section}: {person_sections}")
              if "KWHH-" not in person_sections or "KWR-" not in person_sections:
                  raise SystemExit("Person dossier did not expose linked household and routine references")
              map_data = page.request.get(base + "/data/kingswell-map-data.json").json()
              property_ref = map_data["properties"][0]["ref"]
              map_page_response = page.goto(base + "/city-map.html?property=" + quote(property_ref, safe=""), wait_until="domcontentloaded")
              if not map_page_response or map_page_response.status != 200:
                  raise SystemExit("Map-to-record route did not load")
              page.wait_for_function(
                  "() => document.querySelector('#dtitle')?.textContent !== 'Select a building or road'",
                  timeout=30000,
              )
              if "Open full property record" not in page.locator("#dbody").inner_text():
                  raise SystemExit("Selected map property does not link to its individual record")
              page.locator('#dbody a[href*="record.html"]').click()
              page.wait_for_function(
                  "() => document.querySelector('#title')?.textContent !== 'Loading individual record…'",
                  timeout=30000,
              )
              if page.locator("#title").inner_text() == "Record unavailable":
                  raise SystemExit("Map-selected property record did not load")
              map_href = page.locator("#mapLink").get_attribute("href")
              if "property=" + property_ref not in map_href:
                  raise SystemExit("Property record does not link back to its highlighted map feature")
              page.locator("#mapLink").click()
              page.wait_for_function(
                  "() => document.querySelector('#dtitle')?.textContent !== 'Select a building or road'",
                  timeout=30000,
              )
              if len(map_data.get("landmarks", [])) < 24:
                  raise SystemExit("Canonical city landmark layer is incomplete")
              landmark_name = map_data["landmarks"][0]["name"]
              page.locator("#landmarks").click()
              if "on" not in page.locator("#landmarks").get_attribute("class"):
                  raise SystemExit("Landmark map layer did not enable")
              page.locator("#search").fill(landmark_name)
              page.wait_for_function("name => document.querySelector('#dtitle')?.textContent === name", arg=landmark_name, timeout=15000)
              if page.locator("#dtype").inner_text() != "BP-02 CITY LANDMARK":
                  raise SystemExit("Searching a landmark did not open its individual map record")
              if len(map_data.get("access_points", [])) < 1000:
                  raise SystemExit("Canonical property entrance/access-point layer is incomplete")
              access_ref = map_data["access_points"][0]["ref"]
              page.locator("#access").click()
              if "on" not in page.locator("#access").get_attribute("class"):
                  raise SystemExit("Property entrance layer did not enable")
              page.locator("#search").fill(access_ref)
              page.wait_for_function("ref => document.querySelector('#dtitle')?.textContent === ref", arg=access_ref, timeout=15000)
              if page.locator("#dtype").inner_text() != "BP-02 PROPERTY ACCESS POINT":
                  raise SystemExit("Searching an entrance did not open its individual access-point record")
              print("Chromium passed: live entity directories, full record pages, bidirectional map/property navigation, searchable landmark layer and searchable property entrances.")

              browser.close()
          PY
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
