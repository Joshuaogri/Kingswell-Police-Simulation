name: Read-only Supabase Migration Inventory

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/verify-supabase-migrations.yml"
      - "database/migrations/**"

permissions:
  contents: read

jobs:
  migration-inventory:
    name: Read remote migration history (no deployment)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Configure CLI for the existing migration directory
        shell: bash
        run: |
          mkdir -p supabase
          cat > supabase/config.toml <<'EOF'
          project_id = "gdbzkgejyfwfackyuorl"

          [db]
          major_version = 17
          EOF
          ln -s ../database/migrations supabase/migrations

      - name: Verify database password secret injection
        shell: bash
        run: |
          test -n "$SUPABASE_DB_PASSWORD"
          echo "Database password secret was injected (value not displayed)."

      - name: Read local and remote migration versions over the database connection
        shell: bash
        run: |
          set -euo pipefail
          DB_URL="$(node -e 'process.stdout.write("postgresql://postgres:" + encodeURIComponent(process.env.SUPABASE_DB_PASSWORD) + "@db.gdbzkgejyfwfackyuorl.supabase.co:5432/postgres?sslmode=require")')"
          echo "::add-mask::$DB_URL"
          supabase migration list --db-url "$DB_URL" | tee migration-inventory.txt
          echo "" >> migration-inventory.txt
          echo "READ-ONLY CHECK: no db push, migration repair, reset or SQL write command was run." >> migration-inventory.txt
          echo "LIMITATION: Supabase CLI compares migration timestamps only; it does not verify names or SQL content." >> migration-inventory.txt

      - name: Upload migration inventory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kingswell-supabase-migration-inventory
          path: migration-inventory.txt
          if-no-files-found: ignore
          retention-days: 7
