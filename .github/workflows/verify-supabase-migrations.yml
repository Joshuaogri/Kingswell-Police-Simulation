name: Read-only Supabase Migration Inventory

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  migration-inventory:
    name: Read remote migration history (no deployment)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Configure CLI for the existing migration directory
        shell: bash
        run: |
          mkdir -p supabase
          cat > supabase/config.toml <<'EOF'
          project_id = "gdbzkgejyfwfackyuorl"

          [db]
          major_version = 17
          EOF
          ln -s ../database/migrations supabase/migrations

      - name: Verify database password secret injection
        shell: bash
        run: |
          test -n "$SUPABASE_DB_PASSWORD"
          echo "Database password secret was injected (value not displayed)."

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Read local and remote migration versions over the IPv4 session pooler
        shell: bash
        run: |
          set -euo pipefail
          DB_URL="$(node -e 'process.stdout.write("postgresql://postgres.gdbzkgejyfwfackyuorl:" + encodeURIComponent(process.env.SUPABASE_DB_PASSWORD) + "@aws-1-eu-west-1.pooler.supabase.com:5432/postgres?sslmode=require")')"
          echo "::add-mask::$DB_URL"
          supabase migration list --db-url "$DB_URL" | tee migration-inventory.txt
          echo "" >> migration-inventory.txt
          echo "READ-ONLY CHECK: no db push, migration repair, reset or SQL write command was run." >> migration-inventory.txt
          echo "LIMITATION: Supabase CLI compares migration timestamps only; it does not verify names or SQL content." >> migration-inventory.txt

      - name: Export remote migration statements in a read-only transaction
        shell: bash
        run: |
          set -euo pipefail
          DB_URL="$(node -e 'process.stdout.write("postgresql://postgres.gdbzkgejyfwfackyuorl:" + encodeURIComponent(process.env.SUPABASE_DB_PASSWORD) + "@aws-1-eu-west-1.pooler.supabase.com:5432/postgres?sslmode=require")')"
          echo "::add-mask::$DB_URL"
          psql "$DB_URL" -X -qAt -v ON_ERROR_STOP=1 -c "BEGIN READ ONLY; SELECT COALESCE(json_agg(json_build_object('version', version, 'name', name, 'statements', statements) ORDER BY version), '[]'::json) FROM supabase_migrations.schema_migrations; COMMIT;" > remote-migration-history.json

      - name: Test migration reconciliation logic
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p "test_*.py"

      - name: Compare stored SQL statements with repository migration files
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/audit_supabase_migrations.py --remote remote-migration-history.json --migrations-dir database/migrations --markdown migration-reconciliation.md --json migration-reconciliation.json
          rm remote-migration-history.json

      - name: Upload migration inventory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kingswell-supabase-migration-inventory
          path: |
            migration-inventory.txt
            migration-reconciliation.md
            migration-reconciliation.json
          if-no-files-found: ignore
          retention-days: 7
